<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Keep a family account list, review nominee status and track the next step with each institution.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; worker-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>Virasat · Family nominees</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="modulepreload" href="/i18n.js">
  <link rel="modulepreload" href="/virasat-copy.js">
  <link rel="modulepreload" href="/tracker.js">
  <link rel="modulepreload" href="/privacy.js">
  <script type="module" src="/main.js"></script>
</head>
<body>
  <a class="skip" href="#main" hidden>Skip to main content</a>
  <header class="site-header" hidden>
    <a class="brand" href="/"><svg aria-hidden="true" viewBox="0 0 32 32"><path d="M16 28V5M6 9l10 9L26 9M8 21l8 7 8-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Virasat</span></a>
    <div class="header-tools"><button type="button" id="home-button" class="home-button" aria-label="Home" title="Home"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m3 10 9-7 9 7M5 9v11h5v-6h4v6h5V9"/></svg></button><select id="language" aria-label="Language"></select><button id="access-toggle" class="icon-button" aria-label="Accessibility" aria-expanded="false" aria-controls="access-panel"><span aria-hidden="true">Aa</span></button></div>
    <div id="access-panel" class="access-panel" hidden>
      <div class="size-control"><span id="size-label"></span><button id="text-down" aria-label="Smaller text">A−</button><output id="text-level">100%</output><button id="text-up" aria-label="Larger text">A+</button></div>
      <label><input id="contrast" type="checkbox"><span data-i18n="contrast"></span></label>
      <label><input id="reduce-motion" type="checkbox"><span data-i18n="motion"></span></label>
      <button id="read-aloud" class="text-button" data-i18n="read"></button>
      <p id="voice-status" role="status" aria-live="polite"></p>
    </div>
  </header>
  <main id="main" tabindex="-1"><noscript><h1>Which language do you prefer?</h1><p>JavaScript is needed to use this local preparation tool.</p></noscript></main>

  <footer hidden><button id="help" class="text-button"></button><button id="clear" class="text-button"></button></footer>
  <dialog id="help-dialog"><div class="dialog-head"><h2 id="help-title"></h2><button id="help-close" class="icon-button" aria-label="Close">×</button></div><p id="privacy-detail"></p><p id="translation-notice"></p><p id="help-boundary"></p></dialog>
